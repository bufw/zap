name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (fmt / clippy / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # build web 
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web install dependencies
        run: npm ci || npm install
        working-directory: web

      - name: Web type check
        run: npm run type-check
        working-directory: web

      - name: Web build (production)
        run: npm run build:prod
        working-directory: web

      # require appstore
      - name: Clone builtin appstore repo
        run: |
          mkdir -p data/appstore/repos
          rm -rf data/appstore/repos/appstore
          git clone --depth 1 --branch main https://github.com/zapsh/appstore.git data/appstore/repos/appstore

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt, clippy

      # create zappro stub to let cargo fmt --all resolve zapd mod pro declaration
      - name: Create zappro stub (commercial module placeholder)
        run: |
          mkdir -p zappro/src
          # create a stub mod.rs to let cargo fmt --all resolve zapd mod pro declaration
          printf '%s\n' \
            '// Placeholder for the Zap Pro (commercial) module mount point.' \
            '// Real source is cloned into zappro/ externally.' \
            '// This stub only lets cargo fmt --all resolve zapd mod pro declaration.' \
            > zappro/src/mod.rs

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (warnings as errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build workspace
        run: cargo build --workspace

      - name: Run tests
        run: cargo test --workspace
